name: Export ZipEnhancer to ONNX

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zipEnhancer repo
        uses: actions/checkout@v4
        with:
          repository: boreas-l/zipEnhancer
          path: zipEnhancer

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd zipEnhancer
          pip install torch librosa soundfile numpy onnx onnxruntime onnxscript

      - name: Export to ONNX
        run: |
          cd zipEnhancer
          python export_onnx.py --verify

      - name: Upload ONNX file
        uses: actions/upload-artifact@v4
        with:
          name: zipenhancer-onnx
          path: zipEnhancer/zipenhancer.onnx
